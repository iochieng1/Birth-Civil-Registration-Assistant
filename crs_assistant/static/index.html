<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civil Registration Assistant</title>
<style>
  :root { --bg: #f6f7f4; --card: #fff; --ink: #1d2a24; --muted: #5b6b63; --accent: #006b3f; --warn: #a33a1c; --line: #dfe4df; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121815; --card: #1b2420; --ink: #e8efe9; --muted: #a2b2a9; --accent: #4cc28a; --warn: #ff8a65; --line: #2c3833; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font-size: 1.3rem; margin: 8px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 16px 0; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  select, input, button { font: inherit; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button { background: var(--accent); color: #fff; border: 0; margin-top: 16px; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); width: auto; margin: 0; padding: 6px 12px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; }
  .check input { width: auto; margin-top: 4px; }
  .optional { color: var(--muted); font-size: .9em; }
  .warn { color: var(--warn); font-weight: 600; }
  .ok { color: var(--accent); font-weight: 600; }
  .muted { color: var(--muted); font-size: .9em; }
  ol { padding-left: 20px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="title">Birth &amp; Death Registration Assistant</h1>
    <button class="secondary" id="lang-toggle" type="button">Kiswahili</button>
  </header>
  <p class="muted" data-i18n="intro">Find out exactly what to bring before you go, so you only make one trip.</p>

  <form class="card" id="case-form">
    <label for="service" data-i18n="service">What do you need?</label>
    <select id="service">
      <option value="register" data-i18n="svc_register">Register a birth / get a birth certificate</option>
      <option value="replacement" data-i18n="svc_replacement">Replace a lost certificate</option>
      <option value="correction" data-i18n="svc_correction">Correct details on a certificate</option>
      <option value="death" data-i18n="svc_death">Register a death / get a death certificate</option>
      <option value="death_replacement" data-i18n="svc_death_replacement">Replace a lost death certificate</option>
    </select>

    <div id="applicant-field">
      <label for="applicant" data-i18n="applicant">Who is applying?</label>
      <select id="applicant">
        <option value="parent" data-i18n="app_parent">Parent</option>
        <option value="guardian" data-i18n="app_guardian">Guardian</option>
        <option value="self" data-i18n="app_self">Myself (adult)</option>
      </select>
    </div>

    <div id="birth-fields">
      <label for="dob" data-i18n="dob">Date of birth</label>
      <input id="dob" type="date" required>

      <label for="place" data-i18n="place">Where was the child born?</label>
      <select id="place">
        <option value="facility" data-i18n="place_facility">Hospital / clinic</option>
        <option value="home" data-i18n="place_home">At home</option>
        <option value="abroad" data-i18n="place_abroad">Outside Kenya</option>
      </select>

      <div id="father-field">
        <label for="father" data-i18n="father">Father's details</label>
        <select id="father">
          <option value="married" data-i18n="father_married">Parents are married</option>
          <option value="unmarried" data-i18n="father_unmarried">Not married, father to be listed</option>
          <option value="none" data-i18n="father_none">Father not to be listed</option>
        </select>
      </div>
    </div>

    <div id="death-fields" hidden>
      <p class="muted" data-i18n="condolences">We are sorry for your loss.</p>
      <label for="dod" data-i18n="dod">Date of death</label>
      <input id="dod" type="date">

      <label for="death-place" data-i18n="death_place">Where did the death happen?</label>
      <select id="death-place">
        <option value="facility" data-i18n="place_facility">Hospital / clinic</option>
        <option value="home" data-i18n="death_place_home">At home / in the community</option>
        <option value="abroad" data-i18n="place_abroad">Outside Kenya</option>
      </select>

      <label for="circumstance" data-i18n="circumstance">Cause of death</label>
      <select id="circumstance">
        <option value="natural" data-i18n="cause_natural">Illness / natural causes</option>
        <option value="unnatural" data-i18n="cause_unnatural">Accident, violence or unknown cause</option>
      </select>

      <label for="deceased-id" data-i18n="deceased_id">Did the deceased have a national ID?</label>
      <select id="deceased-id">
        <option value="yes" data-i18n="yes">Yes</option>
        <option value="no" data-i18n="no">No</option>
      </select>
    </div>

    <button type="submit" data-i18n="show">Show my checklist</button>
  </form>

  <section class="card" id="result" hidden>
    <h2 id="category"></h2>
    <p id="deadline"></p>
    <div id="warnings"></div>
    <h3 data-i18n="bring">Tick what you already have</h3>
    <div id="items"></div>
    <p id="readiness" aria-live="polite"></p>
    <h3 data-i18n="steps">Steps</h3>
    <ol id="steps"></ol>
    <p class="muted" id="disclaimer"></p>
  </section>

  <section class="card" id="booking" hidden>
    <h3 data-i18n="book">Book a time at the office</h3>
    <label for="county" data-i18n="county">County</label>
    <select id="county"></select>
    <label for="day" data-i18n="day">Day</label>
    <input id="day" type="date">
    <label for="slot" data-i18n="slot">Time</label>
    <select id="slot"></select>
    <label for="phone" data-i18n="phone">Phone number (for SMS confirmation)</label>
    <input id="phone" type="tel" placeholder="07XX XXX XXX">
    <button type="button" id="book-btn" data-i18n="confirm">Book appointment</button>
    <p id="booking-msg" aria-live="polite"></p>
  </section>
</main>
<script>
const UI = {
  sw: {
    title: "Msaidizi wa Usajili wa Kuzaliwa na Vifo",
    svc_death: "Sajili kifo / pata cheti cha kifo", svc_death_replacement: "Badilisha cheti cha kifo kilichopotea",
    condolences: "Pole sana kwa msiba.", dod: "Tarehe ya kifo", death_place: "Kifo kilitokea wapi?",
    death_place_home: "Nyumbani / katika jamii", circumstance: "Chanzo cha kifo",
    cause_natural: "Ugonjwa / sababu za kawaida", cause_unnatural: "Ajali, vurugu au sababu isiyojulikana",
    deceased_id: "Marehemu alikuwa na kitambulisho cha taifa?", yes: "Ndiyo", no: "Hapana",
    intro: "Jua hasa unachohitaji kubeba kabla ya kwenda, ili ufanye safari moja tu.",
    service: "Unahitaji nini?", svc_register: "Sajili kuzaliwa / pata cheti cha kuzaliwa",
    svc_replacement: "Badilisha cheti kilichopotea", svc_correction: "Sahihisha maelezo ya cheti",
    applicant: "Nani anaomba?", app_parent: "Mzazi", app_guardian: "Mlezi", app_self: "Mimi mwenyewe (mtu mzima)",
    dob: "Tarehe ya kuzaliwa", place: "Mtoto alizaliwa wapi?", place_facility: "Hospitali / kliniki",
    place_home: "Nyumbani", place_abroad: "Nje ya Kenya", father: "Maelezo ya baba",
    father_married: "Wazazi wameoana", father_unmarried: "Hawajaoana, baba aandikwe", father_none: "Baba asiandikwe",
    show: "Onyesha orodha yangu", bring: "Weka alama kwa ulivyonavyo", steps: "Hatua",
    book: "Weka miadi ofisini", county: "Kaunti", day: "Siku", slot: "Saa",
    phone: "Nambari ya simu (kwa ujumbe wa uthibitisho)", confirm: "Weka miadi",
    deadline: "Mwisho wa kusajili kwa wakati", days: "siku zimebaki", optional: "kama kipo",
    anyOne: "Mojawapo ya hizi:", noSlots: "Hakuna nafasi siku hii", booked: "Miadi imewekwa"
  },
  en: {
    deadline: "Deadline to register on time", days: "day(s) left", optional: "if available",
    anyOne: "Any one of these:", noSlots: "No free slots on this day", booked: "Booked"
  }
};
let lang = "en";
let lastRequest = null;
const $ = (id) => document.getElementById(id);
const english = {};
document.querySelectorAll("[data-i18n]").forEach((el) => { english[el.dataset.i18n] = el.textContent; });
const tr = (key) => (lang === "sw" ? UI.sw[key] : UI.en[key] || english[key]) || english[key] || key;

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = tr(el.dataset.i18n); });
  $("lang-toggle").textContent = lang === "en" ? "Kiswahili" : "English";
  if (lastRequest) loadChecklist();
}

const isDeath = () => $("service").value.startsWith("death");

function syncFields() {
  const death = isDeath();
  const registering = $("service").value === "register";
  const registeringDeath = $("service").value === "death";
  $("applicant-field").hidden = death;
  $("birth-fields").hidden = !registering;
  $("dob").required = registering;
  $("father-field").hidden = $("applicant").value === "self";
  $("death-fields").hidden = !registeringDeath;
  $("dod").required = registeringDeath;
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

function buildDeathRequest(have) {
  const registering = $("service").value === "death";
  return {
    service: $("service").value,
    date_of_death: registering ? $("dod").value : today(),
    place_of_death: $("death-place").value,
    circumstance: $("circumstance").value,
    deceased_had_id: $("deceased-id").value === "yes",
    lang, have,
  };
}

function buildRequest(have) {
  if (isDeath()) return buildDeathRequest(have);
  const father = $("father").value;
  const registering = $("service").value === "register";
  return {
    service: $("service").value,
    applicant: $("applicant").value,
    date_of_birth: registering ? $("dob").value : today(),
    birth_place: $("place").value,
    parents_married: father === "married",
    include_father: father !== "none" && $("applicant").value !== "self",
    lang, have,
  };
}

async function post(url, body) {
  const resp = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await resp.json();
  if (!resp.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Please check your answers.");
  return data;
}

function ticked() {
  return [...document.querySelectorAll("#items input:checked")].map((el) => el.value);
}

async function loadChecklist() {
  lastRequest = buildRequest(ticked());
  let data;
  try { data = await post(isDeath() ? "checklist/death" : "checklist", lastRequest); }
  catch (err) { $("result").hidden = false; $("category").textContent = err.message; return; }
  render(data);
}

function render({ checklist, readiness }) {
  $("result").hidden = false;
  $("category").textContent = checklist.category_label;
  $("deadline").textContent = checklist.deadline
    ? `${tr("deadline")}: ${checklist.deadline} (${Math.max(checklist.days_remaining, 0)} ${tr("days")})` : "";
  $("warnings").replaceChildren(...checklist.warnings.map((w) => Object.assign(document.createElement("p"), { className: "warn", textContent: w })));
  const have = new Set(lastRequest.have || []);
  const items = [];
  let groupShown = false;
  for (const item of checklist.items) {
    if (item.group && !groupShown) {
      items.push(Object.assign(document.createElement("p"), { textContent: tr("anyOne") }));
      groupShown = true;
    }
    const row = document.createElement("label");
    row.className = "check";
    const box = Object.assign(document.createElement("input"), { type: "checkbox", value: item.id, checked: have.has(item.id) });
    box.addEventListener("change", loadChecklist);
    const text = document.createElement("span");
    text.textContent = item.label;
    if (!item.mandatory) text.append(Object.assign(document.createElement("span"), { className: "optional", textContent: ` (${tr("optional")})` }));
    row.append(box, text);
    items.push(row);
  }
  $("items").replaceChildren(...items);
  $("steps").replaceChildren(...checklist.steps.map((s) => Object.assign(document.createElement("li"), { textContent: s })));
  $("disclaimer").textContent = checklist.disclaimer;
  $("readiness").className = readiness && readiness.ready ? "ok" : "warn";
  $("readiness").textContent = readiness ? readiness.message : "";
  $("booking").hidden = checklist.category === "abroad" || checklist.category === "death_abroad";
}

async function loadSlots() {
  $("slot").replaceChildren();
  $("booking-msg").textContent = "";
  if (!$("county").value || !$("day").value) return;
  const offices = await (await fetch(`offices?county=${$("county").value}`)).json();
  if (!offices.length) return;
  $("county").dataset.office = offices[0].id;
  const resp = await fetch(`offices/${offices[0].id}/slots?day=${$("day").value}`);
  const data = await resp.json();
  if (!resp.ok || !Object.keys(data.slots).length) {
    $("booking-msg").textContent = resp.ok ? tr("noSlots") : data.detail;
    return;
  }
  $("slot").replaceChildren(...Object.keys(data.slots).map((s) => new Option(s, s)));
}

async function book() {
  try {
    const appt = await post("appointments", {
      office_id: Number($("county").dataset.office), day: $("day").value, slot: $("slot").value,
      phone: $("phone").value, service: $("service").value, lang,
    });
    $("booking-msg").className = "ok";
    $("booking-msg").textContent = `${tr("booked")}: ${appt.reference} — ${appt.office_name}, ${appt.day} ${appt.slot}`;
    loadSlots();
  } catch (err) {
    $("booking-msg").className = "warn";
    $("booking-msg").textContent = err.message;
  }
}

async function init() {
  const counties = await (await fetch("counties")).json();
  $("county").replaceChildren(new Option("—", ""), ...counties.map((c) => new Option(c.name, c.code)));
  $("dob").max = $("dod").max = today();
}

$("lang-toggle").addEventListener("click", () => { lang = lang === "en" ? "sw" : "en"; applyLang(); });
$("service").addEventListener("change", syncFields);
$("applicant").addEventListener("change", syncFields);
$("case-form").addEventListener("submit", (e) => { e.preventDefault(); $("items").replaceChildren(); loadChecklist(); });
$("county").addEventListener("change", loadSlots);
$("day").addEventListener("change", loadSlots);
$("book-btn").addEventListener("click", book);
syncFields();
init();
</script>
</body>
</html>
